services:
  # PostgreSQL 16 Database (Isolated Internal Network, Non-Root)
  postgres:
    image: postgres:16-alpine
    container_name: threatnex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatnex_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-threatnex_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - threatnex_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatnex} -d ${POSTGRES_DB:-threatnex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # Redis (Isolated Internal Network, Persistent Volume)
  redis:
    image: redis:7-alpine
    container_name: threatnex_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - threatnex_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ThreatNex Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatnex_backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-threatnex}:${POSTGRES_PASSWORD:-threatnex_secure_password}@postgres:5432/${POSTGRES_DB:-threatnex_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${PROD_SECRET_KEY:-threatnex-prod-runtime-master-token-encryption-entropy-64chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      ALIENVAULT_OTX_API_KEY: ${ALIENVAULT_OTX_API_KEY:-${ALIENVAULT_OTX_KEY:-}}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    networks:
      - threatnex_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  # ThreatNex Frontend (React / Hardened Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatnex_frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      - /var/run:mode=1777,size=16M
      - /var/cache/nginx:mode=1777,size=64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      - threatnex_internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  threatnex_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
