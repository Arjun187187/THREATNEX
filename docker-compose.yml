services:
  # PostgreSQL 16 Database (Isolated Internal Network, No Public Port Mapping)
  postgres:
    image: postgres:16-alpine
    container_name: threatnex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatnex_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-threatnex_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - threatnex_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatnex} -d ${POSTGRES_DB:-threatnex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # Redis (Isolated Internal Network, No Public Port Mapping)
  redis:
    image: redis:7-alpine
    container_name: threatnex_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - threatnex_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ThreatNex Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatnex_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-threatnex}:${POSTGRES_PASSWORD:-threatnex_secure_password}@postgres:5432/${POSTGRES_DB:-threatnex_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-threatnex-super-secret-key-change-this-in-env-file-32chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - threatnex_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  # ThreatNex Frontend (React / Hardened Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatnex_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      - threatnex_internal
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  threatnex_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
